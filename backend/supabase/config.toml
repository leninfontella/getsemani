project_id = "getsemani"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:3000", "http://localhost:8080"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.delete-account]
# Validação no gateway e novamente com auth.getUser (defesa em profundidade).
verify_jwt = true

[functions.avatar]
# Validação no gateway e novamente com auth.getUser (defesa em profundidade).
verify_jwt = true
