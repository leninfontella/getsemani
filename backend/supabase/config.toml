project_id = "getsemani"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:3000"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.delete-account]
# A função valida explicitamente o JWT com auth.getUser antes de usar o cliente administrativo.
verify_jwt = false

[functions.avatar]
# A função valida explicitamente o JWT e mantém as credenciais Google somente no servidor.
verify_jwt = false
